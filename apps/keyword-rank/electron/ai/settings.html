<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'"><title>AI 安全设置</title><link rel="stylesheet" href="settings.css"></head><body>
<main><span class="badge">仅保存在这台电脑</span><h1>连接你的 AI 平台</h1><p>密钥仅用于你填写的 API 地址。中转平台会收到请求内容，请先确认平台可信及其数据留存政策。</p>
<form id="settings"><label>HTTPS API 地址（完整接口或 /v1 基地址）<input id="endpoint" type="url" placeholder="https://你的平台/v1" required autocomplete="off"></label><label>模型名称<input id="model" required maxlength="160" autocomplete="off" placeholder="平台提供的模型 ID"></label><label>API 密钥<input id="key" type="password" maxlength="512" autocomplete="off" placeholder="不回显已保存密钥；留空保留原密钥"></label><label class="check"><input id="persist" type="checkbox"> 使用 Windows 系统加密保存；不勾选则仅本次会话有效</label><label class="check"><input id="confirm" type="checkbox" required> 我确认将密钥用于上述地址，并知晓该平台会收到所选分析数据</label><div class="actions"><button type="submit">保存连接设置</button><button type="button" id="clear">清除密钥</button></div></form><p id="status" role="status"></p><small>密钥不会写入业务备份、网页代码或发布包。若电脑账户被入侵，本机加密无法完全保护正在使用的密钥。</small></main><script src="settings.js"></script></body></html>
